# On every push:
#  - urdf:  builds the URDF + xacro of the MIRTE Master from the committed sw2robot extract (sw2robot/).
#           The extract is made locally with tools/urdf/Sync-Sw2Robot.ps1 (see tools/urdf/README.md).
#  - parts: checks and publishes the committed STEP / STL / DXF part exports (exports/), made locally with
#           tools/export/Export-Parts.ps1 (see tools/export/README.md).
# SolidWorks cannot run here, so both fail when the SolidWorks files changed after the local extract / export.
# A pushed tag v* also publishes both as a GitHub release.
name: URDF and part exports

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  urdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check the sw2robot extract matches the SolidWorks model
        run: python tools/urdf/build_urdf.py --check-only

      - name: Install sw2robot (the version that made the extract)
        run: |
          v="$(python tools/urdf/build_urdf.py --print-sw2robot-version)"
          echo "sw2robot $v"
          python -m pip install --upgrade pip
          python -m pip install "sw2robot==$v" "xacro==2.1.1"

      - name: Build URDF and xacro
        run: python tools/urdf/build_urdf.py --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: urdf
          path: dist/
          if-no-files-found: error

  parts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check the part exports match the SolidWorks model
        run: python tools/export/check_exports.py --out parts

      - uses: actions/upload-artifact@v7
        with:
          name: parts
          path: parts/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [urdf, parts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: urdf
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: parts
          path: parts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          urdf_zip="mirte-master-frame-urdf-${GITHUB_REF_NAME}.zip"
          parts_zip="mirte-master-frame-parts-${GITHUB_REF_NAME}.zip"
          (cd dist && zip -qr "../${urdf_zip}" .)
          (cd parts && zip -qr "../${parts_zip}" .)
          gh release create "$GITHUB_REF_NAME" "$urdf_zip" "$parts_zip" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "$urdf_zip" "$parts_zip" --repo "$GITHUB_REPOSITORY" --clobber
